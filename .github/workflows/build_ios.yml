name: Build iOS IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Automatically detects flutter version from pubspec/lockfile or uses latest stable

      # 3. Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 4. Build iOS App (without code signing)
      - name: Build Flutter iOS App
        run: flutter build ipa --no-codesign

      # 5. Pack into .ipa format for sideloading
      - name: Package App into IPA
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //g' | tr -d '"' | tr -d "'")
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p Payload
          cp -r build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app Payload/
          zip -r "OpenDragy_v${VERSION}.ipa" Payload

      # 6. Upload the finished IPA as a GitHub Actions Artifact
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenDragy-iOS-v${{ env.APP_VERSION }}
          path: OpenDragy_v${{ env.APP_VERSION }}.ipa
