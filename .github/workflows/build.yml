name: Build Mobile Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter iOS App
        run: flutter build ipa --no-codesign

      - name: Package App into IPA
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //g' | tr -d '"' | tr -d "'" | cut -d'+' -f1)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p Payload
          cp -r build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app Payload/
          zip -r "OpenDragy_v${VERSION}.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenDragy-iOS-v${{ env.APP_VERSION }}
          path: OpenDragy_v${{ env.APP_VERSION }}.ipa

  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Require signing secrets
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure repo secrets under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Configure Keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=${ANDROID_STORE_PASSWORD}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "storeFile=app/upload-keystore.jks"
          } > android/key.properties

      - name: Build Flutter Android APK
        run: flutter build apk --release

      - name: Rename and Package APK
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //g' | tr -d '"' | tr -d "'" | cut -d'+' -f1)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          cp build/app/outputs/flutter-apk/app-release.apk "OpenDragy_v${VERSION}.apk"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=v${VERSION}" >> $GITHUB_ENV
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenDragy-Android-v${{ env.APP_VERSION }}
          path: OpenDragy_v${{ env.APP_VERSION }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: OpenDragy ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: OpenDragy_v${{ env.APP_VERSION }}.apk
          fail_on_unmatched_files: true
